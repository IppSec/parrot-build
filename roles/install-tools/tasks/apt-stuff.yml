---
- name: "Updating apt repo/cache"
  apt: update_cache=yes force_apt_get=yes cache_valid_time=3600
  become: true
  become_method: sudo

- name: "Upgrade all packages"
  apt: upgrade=yes force_apt_get=yes
  become: true
  become_method: sudo

- name: "Remove unofficial docker images"
  package:
    name: 
      - docker.io
      - docker-compose
      - docker-doc
      - podman-docker
    state: absent
  register: docker_remove  
  become: true
  become_method: sudo

- name: "Remove NetExec - We want to use pipx for this"
  package:
    name: 
      - netexec
    state: absent
  become: true
  become_method: sudo

- name: "Remove Containerd/Runc"
  package:
    name: 
      - containerd
      - runc
    state: absent
  when: docker_remove.changed
  become: true
  become_method: sudo

- name: "Installing Packages"
  package:
    name:
      - jq
      - pipx
      - ntpdate
      - flameshot
      - exiftool
      - rsyslog
      - ca-certificates
      - curl
      - gh
      - python3-debian
      - golang-go
      - ruby
      - ruby-dev
      - build-essential
      - dconf-cli
    state: latest
  become: true
  become_method: sudo

- name: "Ensure APT keyrings directory exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  become_method: sudo

- name: "Add Docker's official GPG key to /etc/apt/keyrings"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/debian/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true
  become_method: sudo

- name: "Configure the Docker APT repository (DEB822)"
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/debian"
    suites: "{{ distribution | default(ansible_facts['distribution_release'], true) }}"
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true
  register: docker_repo
  become: true
  become_method: sudo

- name: "Update apt cache after configuring the Docker repository"
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed
  become: true
  become_method: sudo

- name: "Upgrade all packages"
  apt: upgrade=yes force_apt_get=yes
  become: true
  become_method: sudo

- name: "Install Docker"
  package:
    name: 
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
  become: true
  become_method: sudo

- name: "Ensure APT keyrings directory exists for VSCode"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  become_method: sudo

- name: "Add Microsoft GPG key for VSCode"
  ansible.builtin.get_url:
    url: "https://packages.microsoft.com/keys/microsoft.asc"
    dest: "/etc/apt/keyrings/microsoft.asc"
    mode: "0644"
  become: true
  become_method: sudo

- name: "Configure the VSCode APT repository"
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: "https://packages.microsoft.com/repos/code"
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/microsoft.asc
    state: present
    enabled: true
  register: vscode_repo
  become: true
  become_method: sudo

- name: "Remove conflicting or duplicate packages.microsoft.gpg if it exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings/packages.microsoft.gpg
    state: absent
  become: true
  become_method: sudo

- name: "Update apt cache after configuring the VSCode repository"
  ansible.builtin.apt:
    update_cache: true
  when: vscode_repo.changed
  become: true
  become_method: sudo

- name: "Install VSCode"
  package:
    name:
      - code
    state: latest
  become: true
  become_method: sudo
